name: Installers

# Produces the two shipping artifacts:
#   Windows -> Inno Setup .exe
#   macOS   -> .dmg wrapping the signed .pkg
#
# macOS cannot be cross-built from Windows, so the DMG is produced here on a real
# macOS runner. Run this workflow manually, or on a version tag.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive


      # The dependency download is the only flaky part of this build: CMake fetches
      # ~1 GB of obs-deps, Qt6 and OBS sources from GitHub releases, and a transient
      # "SSL connect error" there fails the whole job. Caching .deps keyed on
      # buildspec.json means that download happens once per dependency bump rather
      # than on every run, which removes most of the exposure and cuts several
      # minutes off the build.
      - name: Cache OBS dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: ${{ runner.os }}-deps-${{ hashFiles('buildspec.json') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Configure and build
        shell: pwsh
        run: |
          # Retry only the configure step, which is what performs the downloads.
          # Deliberately NOT setting CMAKE_TLS_VERIFY=0 - disabling certificate
          # verification on a dependency fetch is a bad trade for a transient error.
          $ok = $false
          foreach ($attempt in 1..3) {
            Write-Host "configure attempt $attempt of 3"
            cmake --preset windows-x64
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "configure failed (exit $LASTEXITCODE); retrying in 15s"
            Start-Sleep -Seconds 15
          }
          if (-not $ok) { throw "cmake configure failed after 3 attempts" }
          cmake --build --preset windows-x64 --config RelWithDebInfo

      - name: Build installer
        shell: pwsh
        run: |
          # Inno Setup ships on the GitHub windows-2022 image.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc "/DSourceDir=$(Resolve-Path 'build_x64\RelWithDebInfo')" `
                  "/DDataDir=$(Resolve-Path 'data')" `
                  "build-aux\windows\installer.iss"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/*.exe

  macos:
    name: macOS DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # OBS 31 requires the macOS 15.0 SDK (Xcode 16+). The macos-14 image ships
      # Xcode 15.4 / SDK 14.5, which fails check_sdk_requirements outright. Select
      # the newest Xcode present rather than trusting the image default.
      - name: Select Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "using ${latest}"
          sudo xcode-select -s "${latest}/Contents/Developer"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version


      # The dependency download is the only flaky part of this build: CMake fetches
      # ~1 GB of obs-deps, Qt6 and OBS sources from GitHub releases, and a transient
      # "SSL connect error" there fails the whole job. Caching .deps keyed on
      # buildspec.json means that download happens once per dependency bump rather
      # than on every run, which removes most of the exposure and cuts several
      # minutes off the build.
      - name: Cache OBS dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: ${{ runner.os }}-deps-${{ hashFiles('buildspec.json') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Configure and build
        run: |
          for attempt in 1 2 3; do
            echo "configure attempt ${attempt} of 3"
            cmake --preset macos && break
            if [ "${attempt}" = "3" ]; then
              echo "cmake configure failed after 3 attempts" >&2
              exit 1
            fi
            echo "configure failed; retrying in 15s"
            sleep 15
          done
          cmake --build --preset macos --config RelWithDebInfo

      # Without these secrets the package is built unsigned: it still installs, but
      # Gatekeeper reports it as damaged rather than showing a security prompt.
      - name: Package
        env:
          CODESIGN_IDENT: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
          CODESIGN_IDENT_INSTALLER: ${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}
          CODESIGN_IDENT_USER: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          CODESIGN_IDENT_PASS: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
        run: |
          ./.github/scripts/package-macos --config RelWithDebInfo

      - name: Build DMG
        env:
          CODESIGN_IDENT: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
          CODESIGN_IDENT_USER: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          CODESIGN_IDENT_PASS: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
        run: |
          chmod +x build-aux/macos/make-dmg.zsh
          ./build-aux/macos/make-dmg.zsh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
